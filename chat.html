<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nani? - Synthwave Chat</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>

<div class="chat-layout">
    <aside class="chat-sidebar" id="mobileSidebar">
        <div class="sidebar-header">
            <div class="sidebar-header-left" style="cursor:pointer;" id="myProfileTrigger">
                <div style="position: relative;">
                    <img id="myMiniAvatar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Avatar">
                    <div class="status-indicator"></div>
                </div>
                <div class="user-info">
                    <h3>Nani?</h3>
                    <p id="currentUserDisplay">Cargando...</p>
                </div>
            </div>
            <button id="configBtn" title="Ajustes y Diseño"><i class="fas fa-cog"></i></button>
        </div>

        <button id="savedMessagesBtn" class="saved-btn"><i class="fas fa-bookmark"></i> Mis Guardados</button>

        <div class="room-selector">
            <h4>Salas Públicas</h4>
            
            <div class="custom-dropdown" id="roomDropdown">
                <div class="dropdown-header" id="dropdownHeader">
                    <span id="selectedRoomText">General</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <ul class="dropdown-list" id="dropdownList"></ul>
            </div>
            
            <div style="display: flex; gap: 5px; margin-bottom: 10px;">
                <button id="joinRoomBtn" class="btn-primary" style="flex: 1;">Entrar a la sala</button>
                <button id="deleteRoomBtn" class="btn-icon-small" title="Eliminar sala" style="display:none; padding: 0 15px;"><i class="fas fa-trash"></i></button>
            </div>
            
            <div class="create-room">
                <input type="text" id="newRoomInput" placeholder="Nombre nueva sala...">
                <button id="createRoomBtn" class="btn-icon-small" title="Crear"><i class="fas fa-plus"></i></button>
            </div>
        </div>

        <div class="user-lists-container">
            <h4><i class="fas fa-users"></i> En esta sala</h4>
            <ul id="roomUsers" class="user-list"></ul>
            
            <h4 style="margin-top: 20px;"><i class="fas fa-globe"></i> Globales en línea</h4>
            <ul id="globalUsers" class="user-list"></ul>
        </div>

        <button id="logoutBtn" class="btn-danger"><i class="fas fa-power-off"></i> Desconectar</button>
    </aside>

    <div id="mobileOverlay" class="sidebar-overlay"></div>

    <main class="chat-main" id="chatMainPanel">
        <header class="chat-header">
            <div class="header-info" style="display: flex; align-items: center; gap: 15px;">
                <button id="mobileMenuBtn" class="mobile-only-btn"><i class="fas fa-bars"></i></button>
                <div>
                    <h2 id="roomTitle">Cargando...</h2>
                    <small id="roomCreator" style="color: var(--text-muted); font-size: 0.8rem;"></small>
                </div>
            </div>
            <div class="search-history">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Buscar en la sala...">
            </div>
        </header>

        <div class="chat-messages" id="chatMessages"></div>

        <div id="replyPreview" class="reply-preview">
            <div class="reply-content">
                <span id="replyName"></span>
                <p id="replyText"></p>
            </div>
            <button id="cancelReplyBtn"><i class="fas fa-times"></i></button>
        </div>

        <div id="emojiPicker" class="popup-picker"></div>
        <div id="gifPicker" class="popup-picker gif-picker">
            <div style="display: flex; gap: 5px; width: 100%;">
                <input type="text" id="gifSearch" placeholder="Busca un GIF...">
                <button type="button" id="doGifSearchBtn" class="btn-primary" style="padding: 0 15px;"><i class="fas fa-search"></i></button>
            </div>
            <div id="gifResults" class="gif-results"></div>
        </div>
        <div id="stickerPicker" class="popup-picker gif-picker">
            <h4 style="text-align: center; margin-bottom: 10px; color: var(--text-main);">Mis Stickers</h4>
            <div id="stickerResults" class="gif-results"></div>
        </div>

        <form id="chatForm" class="chat-form">
            <button type="button" id="emojiBtn" class="btn-icon" title="Emojis"><i class="fas fa-smile"></i></button>
            <button type="button" id="gifBtn" class="btn-icon" title="GIFs"><i class="fas fa-film"></i></button>
            <button type="button" id="stickerBtn" class="btn-icon" title="Stickers Favoritos"><i class="fas fa-star"></i></button>
            
            <input type="file" id="fileInput" style="display: none;" accept="image/*">
            <label for="fileInput" class="btn-icon" title="Adjuntar"><i class="fas fa-paperclip"></i></label>
            
            <input type="text" id="messageInput" placeholder="Mensaje..." autocomplete="off">
            
            <button type="button" id="voiceBtn" class="btn-icon voice-btn" title="Grabar audio"><i class="fas fa-microphone"></i></button>
            <button type="submit" class="btn-send"><i class="fas fa-paper-plane"></i></button>
        </form>
    </main>
</div>

<div id="lightboxModal" class="modal lightbox" onclick="this.classList.remove('active')">
    <img id="lightboxImg" src="">
</div>

<div id="discordProfileModal" class="modal">
    <div class="discord-profile-content">
        <div class="discord-banner" id="dProfileBanner"></div>
        <div class="discord-header">
            <img id="dProfileAvatar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png">
            <h3 id="dProfileName">Usuario</h3>
            <p id="dProfileStatus" class="discord-status">Sin estado</p>
        </div>
        <div class="discord-body">
            <button id="dProfileDMBtn" class="btn-primary" style="width:100%; margin-bottom:15px;"><i class="fas fa-paper-plane"></i> Mensaje Privado</button>
            <h4 style="color: var(--text-main);">Muro de Comentarios</h4>
            <div class="discord-comments" id="dProfileComments"></div>
            <div class="discord-comment-input">
                <input type="text" id="dCommentText" placeholder="Escribe en su perfil...">
                <button id="dCommentBtn" class="btn-primary"><i class="fas fa-comment"></i></button>
            </div>
        </div>
        <button id="closeDiscordProfileBtn" class="discord-close-btn"><i class="fas fa-times"></i></button>
    </div>
</div>

<div id="configModal" class="modal">
    <div class="modal-content config-scrollable">
        <h3>Estética y Estado</h3>
        <div class="form-group" style="text-align: center;">
            <div class="avatar-edit">
                <img id="avatarPreview" src="https://cdn-icons-png.flaticon.com/512/149/149071.png">
                <input type="file" id="avatarInput" accept="image/*" style="display: none;">
                <label for="avatarInput" class="custom-file-upload"><i class="fas fa-camera"></i> Cambiar Avatar</label>
            </div>
        </div>
        <div class="form-group">
            <label>Mi Estado Actual</label>
            <input type="text" id="statusInput" placeholder="Ej: Estudiando, Jugando Warframe...">
        </div>
        <div class="color-selectors">
            <div class="form-group center-col">
                <label>Nombre</label>
                <div class="color-picker-wrapper"><input type="color" id="colorPicker" value="#d946ef"></div>
            </div>
            <div class="form-group center-col">
                <label>Burbuja</label>
                <div class="color-picker-wrapper"><input type="color" id="bubbleColorPicker" value="#9333ea"></div>
            </div>
        </div>
        <div class="form-group">
            <label>Transparencia de burbuja (<span id="opacityVal">100%</span>)</label>
            <input type="range" id="bubbleOpacity" min="0.1" max="1" step="0.1" value="1" class="custom-range">
        </div>
        
        <div class="form-group" style="margin-top: 20px;">
            <label>Fondo de pantalla del Chat</label>
            <input type="file" id="bgLocalInput" accept="image/*" style="display: none;">
            <div style="display: flex; gap: 10px;">
                <label for="bgLocalInput" class="custom-file-upload" style="flex: 1; margin: 0;"><i class="fas fa-image"></i> Personalizar</label>
                <button type="button" id="resetBgBtn" class="btn-danger" style="flex: 1; margin: 0; padding: 12px; border-radius: 12px; font-size: 0.9rem;"><i class="fas fa-undo"></i> Restablecer</button>
            </div>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 30px;">
            <button id="closeConfigBtn" class="btn-danger" style="flex: 1; margin: 0;">Cerrar</button>
            <button id="saveConfigBtn" class="btn-primary" style="flex: 1; margin: 0;">Aplicar</button>
        </div>
    </div>
</div>

<audio id="notificationSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
      apiKey: "AIzaSyDEnq3hg0mNd69JymjHKc1fU7XInY6laDk",
      authDomain: "gen-lang-client-0867834675.firebaseapp.com",
      projectId: "gen-lang-client-0867834675",
      storageBucket: "gen-lang-client-0867834675.firebasestorage.app",
      messagingSenderId: "751363702976",
      appId: "1:751363702976:web:3568444232a9343a136d25"
  };

  const app = initializeApp(firebaseConfig);
  window.auth = getAuth(app);
  window.db = getFirestore(app);
  window.doc = doc;
  window.getDoc = getDoc;

  onAuthStateChanged(window.auth, async (user) => {
      if (!user) { window.location.href = 'index.html'; } else {
          const docSnap = await getDoc(doc(window.db, "usuarios", user.uid));
          window.currentUsername = docSnap.exists() ? docSnap.data().username : user.email.split('@')[0];
          document.getElementById('currentUserDisplay').textContent = window.currentUsername;
          document.dispatchEvent(new Event('userReady'));
      }
  });

  document.getElementById('logoutBtn').addEventListener('click', () => signOut(window.auth).then(() => window.location.href = 'index.html'));
</script>
<script src="chat.js"></script>
</body>
</html>
