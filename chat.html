<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat en Tiempo Real - UCSC</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>

<div class="chat-layout">
    <aside class="chat-sidebar">
        <h3><i class="fas fa-comments"></i> UCSC Chat</h3>
        <p id="currentUserDisplay">Usuario: Cargando...</p>
        
        <button id="configBtn" class="btn-secondary" style="width: 100%; margin-bottom: 15px;"><i class="fas fa-cog"></i> Personalizar Chat</button>

        <div class="room-selector">
            <h4>Salas Temáticas</h4>
            <div style="display: flex; gap: 5px; margin-bottom: 10px;">
                <select id="roomSelect" style="flex: 1; padding: 5px; border-radius: 4px;"></select>
                <button id="deleteRoomBtn" class="btn-danger" title="Eliminar sala actual"><i class="fas fa-trash"></i></button>
            </div>
            <button id="joinRoomBtn" class="btn-primary" style="width: 100%; margin-bottom: 10px;">Unirse a la sala</button>
            
            <div class="create-room" style="display: flex; gap: 5px; border-top: 1px solid #455a64; padding-top: 10px;">
                <input type="text" id="newRoomInput" placeholder="Nueva sala..." style="flex: 1; padding: 5px; border-radius: 4px; border: 1px solid #ccc;">
                <button id="createRoomBtn" class="btn-primary" title="Crear Sala"><i class="fas fa-plus"></i></button>
            </div>
        </div>

        <div class="user-lists-container">
            <h4><i class="fas fa-users"></i> En esta sala</h4>
            <ul id="roomUsers" class="user-list"></ul>
            
            <h4 style="margin-top: 10px;"><i class="fas fa-globe"></i> Globales en línea</h4>
            <ul id="globalUsers" class="user-list"></ul>
        </div>

        <button id="logoutBtn" class="btn-danger" style="margin-top: 15px;"><i class="fas fa-sign-out-alt"></i> Salir</button>
    </aside>

    <main class="chat-main">
        <header class="chat-header">
            <h2 id="roomTitle">Sala: General</h2>
            <div class="search-history">
                <input type="text" id="searchInput" placeholder="Buscar mensajes...">
            </div>
        </header>

        <div class="chat-messages" id="chatMessages"></div>

        <form id="chatForm" class="chat-form">
            <div class="emoji-container">
                <button type="button" id="emojiBtn" class="btn-icon"><i class="fas fa-smile"></i></button>
                <div id="emojiPicker" class="emoji-picker">
                    <span class="emoji-item">😀</span><span class="emoji-item">😂</span><span class="emoji-item">🥺</span><span class="emoji-item">😎</span><span class="emoji-item">😍</span>
                    <span class="emoji-item">👍</span><span class="emoji-item">❤️</span><span class="emoji-item">🔥</span><span class="emoji-item">🎉</span><span class="emoji-item">✨</span>
                    <span class="emoji-item">😭</span><span class="emoji-item">🙏</span><span class="emoji-item">😅</span><span class="emoji-item">🤔</span><span class="emoji-item">🥰</span>
                </div>
            </div>
            
            <input type="file" id="fileInput" style="display: none;" accept="image/*">
            <label for="fileInput" class="btn-icon" style="cursor: pointer;" title="Enviar Imagen"><i class="fas fa-image"></i></label>
            
            <button type="button" id="voiceBtn" class="btn-icon voice-btn" title="Mantén presionado para grabar"><i class="fas fa-microphone"></i></button>
            
            <input type="text" id="messageInput" placeholder="Escribe tu mensaje..." autocomplete="off">
            <button type="submit" class="btn-primary"><i class="fas fa-paper-plane"></i></button>
        </form>
    </main>
</div>

<div id="configModal" class="modal">
    <div class="modal-content">
        <h3>Mi Perfil y Diseño</h3>
        
        <div class="form-group" style="text-align: center;">
            <label>Foto de Perfil (Avatar):</label>
            <input type="file" id="avatarInput" accept="image/*" style="font-size: 0.8em; margin-bottom: 5px;">
            <img id="avatarPreview" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" style="width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 2px solid #0084ff;">
        </div>

        <div class="form-group">
            <label>Color de mi nombre:</label>
            <input type="color" id="colorPicker" value="#0084ff" style="width: 100%; height: 40px; border: none; cursor: pointer;">
        </div>

        <div class="form-group">
            <label>Fondo de Chat (WhatsApp Style):</label>
            <input type="file" id="bgLocalInput" accept="image/*" style="font-size: 0.8em;">
            <small style="color: #888;">Elige una imagen de tu PC.</small>
        </div>

        <button id="saveConfigBtn" class="btn-primary" style="width: 100%; margin-top: 15px;">Guardar Cambios</button>
        <button id="closeConfigBtn" class="btn-danger" style="width: 100%; margin-top: 10px;">Cerrar</button>
    </div>
</div>

<audio id="notificationSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
      apiKey: "AIzaSyDEnq3hg0mNd69JymjHKc1fU7XInY6laDk",
      authDomain: "gen-lang-client-0867834675.firebaseapp.com",
      projectId: "gen-lang-client-0867834675",
      storageBucket: "gen-lang-client-0867834675.firebasestorage.app",
      messagingSenderId: "751363702976",
      appId: "1:751363702976:web:3568444232a9343a136d25",
      measurementId: "G-NRST14BV45"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  window.auth = auth;
  window.db = db;
  window.doc = doc;
  window.getDoc = getDoc;
  window.signOut = signOut;

  onAuthStateChanged(auth, async (user) => {
      if (!user) {
          window.location.href = 'login.html';
      } else {
          const docRef = doc(db, "usuarios", user.uid);
          const docSnap = await getDoc(docRef);
          if (docSnap.exists()) {
              window.currentUsername = docSnap.data().username;
          } else {
              window.currentUsername = user.email.split('@')[0];
          }
          document.getElementById('currentUserDisplay').textContent = 'Usuario: ' + window.currentUsername;
          document.dispatchEvent(new Event('userReady'));
      }
  });

  document.getElementById('logoutBtn').addEventListener('click', () => {
      signOut(auth).then(() => window.location.href = 'login.html');
  });
</script>
<script src="chat.js"></script>
</body>
</html>
