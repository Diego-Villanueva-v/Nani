<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nani? - Conectar</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="registro-container">
    <div class="brand-header">
        <div class="lobby-icon-container" style="margin-bottom: 10px;">
            <i class="fas fa-meteor lobby-icon lobby-logo"></i>
        </div>
        <h2 style="font-size: 2.2rem; margin-top: 10px;">Bienvenido a Nani?</h2>
        <p>Conéctate y empieza a chatear.</p>
    </div>

    <form id="loginForm">
        <div class="form-group">
            <label>Correo Electrónico</label>
            <div class="input-wrapper">
                <i class="fas fa-envelope input-icon"></i>
                <input type="email" id="loginEmail" placeholder="tu_correo@ejemplo.com" required>
            </div>
        </div>
        <div class="form-group">
            <label>Contraseña</label>
            <div class="input-wrapper">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>
        </div>
        
        <div style="text-align: right; margin-bottom: 20px;">
            <a href="#" id="forgotPasswordBtn" class="link-text" style="font-size: 0.85rem;">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn-primary">Iniciar Sesión</button>
        
        <div id="loginMensaje" style="text-align: center; margin-top: 15px; font-weight: 600; font-size: 0.9rem; min-height: 20px;"></div>
    </form>

    <div class="divider">
        <span>O ingresa con</span>
    </div>

    <button id="googleLogin" class="btn-google">
        <i class="fab fa-google" style="color: #4285F4; font-size: 1.2rem;"></i>
        Continuar con Google
    </button>

    <p style="text-align: center; margin-top: 25px; color: var(--text-muted);">
        ¿No tienes cuenta? <a href="registro.html" class="link-text">Regístrate aquí</a>
    </p>
</div>

<script type="module" src="login.js"></script>
</body>
</html>
