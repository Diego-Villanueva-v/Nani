<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nani? - Iniciar Sesión</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="registro-container">
    <div class="brand-header">
        <div class="lobby-icon-container" style="margin-bottom: 15px;">
            <i class="fas fa-meteor lobby-icon" style="font-size: 3.5rem; color: var(--accent); text-shadow: 0 0 20px var(--accent); animation: float 3s ease-in-out infinite;"></i>
        </div>
        <h2 style="font-size: 2.2rem; margin-top: 10px;">Nani?</h2>
        <p>Conéctate y empieza a chatear con tus amigos.</p>
    </div>
    
    <form id="loginForm">
        <div class="form-group">
            <label for="loginEmail">Correo electrónico</label>
            <div class="input-wrapper" style="position: relative; display: flex; align-items: center;">
                <input type="email" id="loginEmail" placeholder="ejemplo@correo.com" style="width: 100%;" required>
            </div>
        </div>

        <div class="form-group">
            <label for="loginPassword">Contraseña</label>
            <div class="input-wrapper" style="position: relative; display: flex; align-items: center;">
                <input type="password" id="loginPassword" placeholder="Tu contraseña" style="width: 100%;" required>
            </div>
        </div>

        <div style="text-align: right; margin-bottom: 20px;">
            <a href="#" id="forgotPasswordBtn" class="link-text small-text" style="font-size: 0.85rem;">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" id="loginBtn" class="btn-primary">Ingresar al sistema</button>
        
        <div class="divider"><span>O ingresa con</span></div>
        
        <button type="button" id="googleLoginBtn" class="btn-google">
            <i class="fab fa-google" style="color: #4285F4; font-size: 1.2rem;"></i> Continuar con Google
        </button>

        <div id="loginMensaje" style="text-align: center; margin-top: 15px; font-weight: bold; font-size: 0.9rem; min-height: 25px;"></div>
        
        <div style="text-align: center; margin-top: 25px;">
            <span style="color: #8b949e; font-size: 0.9rem;">¿No tienes cuenta?</span> 
            <a href="registro.html" class="link-text">Regístrate aquí</a>
        </div>
    </form>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
      apiKey: "AIzaSyDEnq3hg0mNd69JymjHKc1fU7XInY6laDk",
      authDomain: "gen-lang-client-0867834675.firebaseapp.com",
      projectId: "gen-lang-client-0867834675",
      storageBucket: "gen-lang-client-0867834675.firebasestorage.app",
      messagingSenderId: "751363702976",
      appId: "1:751363702976:web:3568444232a9343a136d25"
  };

  const app = initializeApp(firebaseConfig);
  window.auth = getAuth(app);
  window.db = getFirestore(app);
  window.signInWithEmailAndPassword = signInWithEmailAndPassword;
  window.GoogleAuthProvider = GoogleAuthProvider;
  window.signInWithPopup = signInWithPopup;
  window.sendPasswordResetEmail = sendPasswordResetEmail;
  window.doc = doc;
  window.setDoc = setDoc;
  window.getDoc = getDoc;
</script>
<script src="login.js"></script>
</body>
</html>
