<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nani? - Iniciar Sesión</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div id="toastNotification" class="toast"></div>

<div id="splashScreen" class="splash-screen">
    <img src="Nani_logo.png" class="nani-logo-img" alt="Nani Logo">
    <p style="color: var(--accent); margin-top: 10px; font-weight: 600; letter-spacing: 2px; animation: pulse 1.5s infinite;">CARGANDO...</p>
</div>

<div class="registro-container" id="loginContainer" style="opacity: 0; transition: opacity 0.5s ease; pointer-events: none;">
    <div class="brand-header">
        <img src="Nani_logo.png" class="nani-logo-img" style="margin-bottom: 10px; animation: none;" alt="Nani Logo">
        <p>Inicia sesión para conectarte.</p>
    </div>

    <form id="loginForm">
        <div class="form-group">
            <label>Correo Electrónico</label>
            <div class="input-wrapper">
                <i class="fas fa-envelope input-icon"></i>
                <input type="email" id="loginEmail" placeholder="ejemplo@correo.com" required>
            </div>
        </div>
        <div class="form-group">
            <label>Contraseña</label>
            <div class="input-wrapper">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>
        </div>
        
        <div style="text-align: right; margin-bottom: 20px;">
            <a href="#" id="forgotPasswordBtn" class="link-text" style="font-size: 0.85rem;">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" id="loginBtn" class="btn-primary">Iniciar Sesión</button>
    </form>

    <div class="divider"><span>O continúa con</span></div>

    <button id="googleLogin" class="btn-google">
        <i class="fab fa-google" style="color: #4285F4; font-size: 1.2rem;"></i> Google
    </button>

    <p style="text-align: center; margin-top: 25px; color: var(--text-muted);">
        ¿Aún no tienes cuenta? <a href="registro.html" class="link-text">Regístrate aquí</a>
    </p>
</div>

<script type="module" src="login.js"></script>
</body>
</html>
