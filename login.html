<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="registro-container">
    <h2>Iniciar Sesión</h2>
    <form id="loginForm">
        
        <div class="form-group">
            <label for="loginEmail">Correo electrónico</label>
            <div class="input-wrapper">
                <input type="email" id="loginEmail" placeholder="ejemplo@correo.com" required>
            </div>
        </div>

        <div class="form-group">
            <label for="loginPassword">Contraseña</label>
            <div class="input-wrapper">
                <input type="password" id="loginPassword" placeholder="Tu contraseña" required>
            </div>
        </div>

        <button type="submit" id="loginBtn">Ingresar</button>
        <div id="loginMensaje" style="text-align: center; margin-top: 15px; font-weight: bold;"></div>
        
        <div style="text-align: center; margin-top: 15px;">
            <a href="index.html" style="color: #007bff; text-decoration: none; font-size: 14px;">¿No tienes cuenta? Regístrate aquí</a>
        </div>
    </form>
</div>

</script>
<script src="login.js"></script>
</body>
</html>
