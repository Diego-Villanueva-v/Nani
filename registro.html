<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Avanzado</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<div class="registro-container">
    <h2>Crear Cuenta</h2>
    <form id="registroForm">
        
        <div class="form-group">
            <label for="username">Nombre de usuario</label>
            <div class="input-wrapper">
                <input type="text" id="username" placeholder="Mínimo 6 caracteres, sin símbolos">
                <i class="icon fas"></i>
            </div>
            <div id="usernameError" class="error-message"></div>
        </div>

        <div class="form-group">
            <label for="email">Correo electrónico</label>
            <div class="input-wrapper">
                <input type="email" id="email" placeholder="ejemplo@correo.com">
                <i class="icon fas"></i>
            </div>
            <div id="emailError" class="error-message"></div>
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <div class="input-wrapper">
                <input type="password" id="password" placeholder="Mín 8 carac., 1 Mayús., 1 Minús., 1 Núm.">
                <i class="icon fas"></i>
            </div>
            <div id="passwordError" class="error-message"></div>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirmar contraseña</label>
            <div class="input-wrapper">
                <input type="password" id="confirmPassword" placeholder="Repite tu contraseña">
                <i class="icon fas"></i>
            </div>
            <div id="confirmPasswordError" class="error-message"></div>
        </div>

        <button type="submit" id="submitBtn" disabled>Registrarse</button>
        <div id="mensajeFinal" style="text-align: center; margin-top: 15px; font-weight: bold;"></div>
        
        <div style="text-align: center; margin-top: 15px;">
            <a href="login.html" style="color: #007bff; text-decoration: none; font-size: 14px;">¿Ya tienes cuenta? Inicia sesión aquí</a>
        </div>
    </form>
</div>

  window.setDoc = setDoc;
</script>
<script src="script.js"></script>
</body>
</html>
