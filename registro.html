<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nani? - Crear Cuenta</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<div class="registro-container">
    <div class="brand-header">
        <h2>Unirse a Nani?</h2>
        <p>Crea tu identidad en el sistema.</p>
    </div>
    <form id="registroForm">
        
        <div class="form-group">
            <label for="username">Nombre de usuario</label>
            <div class="input-wrapper">
                <input type="text" id="username" placeholder="Mínimo 6 caracteres, sin símbolos">
                <i class="icon fas"></i>
            </div>
            <div id="usernameError" class="error-message"></div>
        </div>

        <div class="form-group">
            <label for="email">Correo electrónico</label>
            <div class="input-wrapper">
                <input type="email" id="email" placeholder="ejemplo@correo.com">
                <i class="icon fas"></i>
            </div>
            <div id="emailError" class="error-message"></div>
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <div class="input-wrapper">
                <input type="password" id="password" placeholder="Mín 8 carac., 1 Mayús., 1 Minús., 1 Núm.">
                <i class="icon fas"></i>
            </div>
            <div id="passwordError" class="error-message"></div>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirmar contraseña</label>
            <div class="input-wrapper">
                <input type="password" id="confirmPassword" placeholder="Repite tu contraseña">
                <i class="icon fas"></i>
            </div>
            <div id="confirmPasswordError" class="error-message"></div>
        </div>

        <button type="submit" id="submitBtn" class="btn-primary" disabled>Crear mi cuenta</button>
        <div id="mensajeFinal" style="text-align: center; margin-top: 15px; font-weight: bold; font-size: 0.9rem;"></div>
        
        <div style="text-align: center; margin-top: 25px;">
            <span style="color: #8b949e; font-size: 0.9rem;">¿Ya tienes cuenta?</span> 
            <a href="index.html" class="link-text">Inicia sesión aquí</a>
        </div>
    </form>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
      apiKey: "AIzaSyDEnq3hg0mNd69JymjHKc1fU7XInY6laDk",
      authDomain: "gen-lang-client-0867834675.firebaseapp.com",
      projectId: "gen-lang-client-0867834675",
      storageBucket: "gen-lang-client-0867834675.firebasestorage.app",
      messagingSenderId: "751363702976",
      appId: "1:751363702976:web:3568444232a9343a136d25"
  };

  const app = initializeApp(firebaseConfig);
  window.auth = getAuth(app);
  window.db = getFirestore(app);
  window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
  window.doc = doc;
  window.setDoc = setDoc;
</script>
<script src="script.js"></script>
</body>
</html>
