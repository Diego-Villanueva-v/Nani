<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nani? - Registro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="registro-container">
    <div class="brand-header">
        <div class="lobby-icon-container" style="margin-bottom: 10px;">
            <i class="fas fa-meteor lobby-icon lobby-logo"></i>
        </div>
        <h2 style="font-size: 2.2rem; margin-top: 10px;">Crear Cuenta</h2>
        <p>Regístrate para empezar a chatear.</p>
    </div>

    <form id="registroForm">
        <div class="form-group">
            <label>Nombre de Usuario (Único)</label>
            <div class="input-wrapper">
                <i class="fas fa-user input-icon"></i>
                <input type="text" id="username" placeholder="Ej: Diego_v" required maxlength="15">
            </div>
            <div id="usernameError" class="error-message"></div>
        </div>

        <div class="form-group">
            <label>Correo Electrónico</label>
            <div class="input-wrapper">
                <i class="fas fa-envelope input-icon"></i>
                <input type="email" id="email" placeholder="tu_correo@ejemplo.com" required>
            </div>
            <div id="emailError" class="error-message"></div>
        </div>

        <div class="form-group">
            <label>Contraseña</label>
            <div class="input-wrapper">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="password" placeholder="Mínimo 8 caracteres" required>
            </div>
            <div id="passwordError" class="error-message"></div>
        </div>

        <div class="form-group">
            <label>Confirmar Contraseña</label>
            <div class="input-wrapper">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="confirmPassword" placeholder="Repite tu contraseña" required>
            </div>
            <div id="confirmPasswordError" class="error-message"></div>
        </div>
        
        <button type="submit" id="submitBtn" class="btn-primary" disabled>Registrarme</button>
        <div id="mensajeFinal" style="text-align: center; margin-top: 15px; font-weight: 600; font-size: 0.9rem; min-height: 20px;"></div>
    </form>

    <p style="text-align: center; margin-top: 25px; color: var(--text-muted);">
        ¿Ya tienes cuenta? <a href="index.html" class="link-text">Inicia Sesión</a>
    </p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
      apiKey: "AIzaSyDEnq3hg0mNd69JymjHKc1fU7XInY6laDk",
      authDomain: "gen-lang-client-0867834675.firebaseapp.com",
      projectId: "gen-lang-client-0867834675",
      storageBucket: "gen-lang-client-0867834675.firebasestorage.app",
      messagingSenderId: "751363702976",
      appId: "1:751363702976:web:3568444232a9343a136d25"
  };

  const app = initializeApp(firebaseConfig);
  window.auth = getAuth(app);
  window.db = getFirestore(app);
  window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
  window.doc = doc;
  window.setDoc = setDoc;
</script>
<script src="script.js"></script>
</body>
</html>
