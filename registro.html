<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nani? - Registro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div id="toastNotification" class="toast"></div>

<div class="registro-container">
    <div class="brand-header">
        <div class="lobby-icon-container" style="margin-bottom: 10px;">
            <i class="fas fa-meteor lobby-icon lobby-logo"></i>
        </div>
        <h2 style="font-size: 2rem; margin-top: 10px;">Crea tu Cuenta</h2>
        <p> y parte de  a Naniii?</p>
    </div>

    <form id="registroForm">
        <div class="form-group">
            <label>Nombre de Usuario</label>
            <div class="input-wrapper">
                <i class="fas fa-user input-icon"></i>
                <input type="text" id="username" placeholder="Tu nombre público" required maxlength="15">
            </div>
            <small id="usernameError" class="error-message"></small>
        </div>

        <div class="form-group">
            <label>Correo Electrónico</label>
            <div class="input-wrapper">
                <i class="fas fa-envelope input-icon"></i>
                <input type="email" id="email" placeholder="ejemplo@correo.com" required>
            </div>
            <small id="emailError" class="error-message"></small>
        </div>

        <div class="form-group">
            <label>Contraseña</label>
            <div class="input-wrapper">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="password" placeholder="Mínimo 6 caracteres" required>
            </div>
            <small id="passwordError" class="error-message"></small>
        </div>

        <button type="submit" id="submitBtn" class="btn-primary">Registrarme</button>
    </form>

    <p style="text-align: center; margin-top: 25px; color: var(--text-muted);">
        ¿Ya tienes cuenta? <a href="index.html" class="link-text">Inicia Sesión</a>
    </p>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
